<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hibernate Assistant Demo</title>
  <style>
    body {
      background: #1b212c;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #bcae79;
      font-size: 2em;
      margin-bottom: 0.3em;
    }
    p {
      color: #888;
      margin-bottom: 2em;
    }
    .links {
      display: flex;
      gap: 30px;
      justify-content: center;
    }
    a {
      display: block;
      background: rgba(188,174,121,0.1);
      border: 1px solid rgba(188,174,121,0.3);
      border-radius: 12px;
      padding: 30px 40px;
      text-decoration: none;
      color: #bcae79;
      font-size: 1.2em;
      transition: background 0.2s;
    }
    a:hover {
      background: rgba(188,174,121,0.2);
    }
    a span {
      display: block;
      font-size: 0.7em;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hibernate Assistant</h1>
    <p>Talk to Your Data</p>
    <div class="links">
      <a href="/chatbot.html">Chatbot<span>Interactive demo UI</span></a>
      <a href="/presentation/slides.html">Presentation<span>Reveal.js slides</span></a>
    </div>
  </div>
</body>
</html>
